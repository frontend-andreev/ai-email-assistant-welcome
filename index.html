<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

<title>Welcome — AI Email Assistant</title>
<link rel="icon" type="image/svg+xml" href="icon64.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    color: #0a1e4d;
    -webkit-font-smoothing: antialiased;
  }

  .main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 25px 24px 120px;
    text-align: center;
  }

  .title {
    margin-bottom: 24px;
  }

  .title-icon {
    display: inline-block;
    width: 48px;
    height: 48px;
    vertical-align: middle;
    margin-right: 12px;
  }

  .title-text {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    text-wrap: balance;
    max-width: calc(100% - 60px);
  }

  h1 {
    font-size: clamp(36px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .try {
    margin-bottom: 40px;
  }

  .try-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9ca3af;
    margin-bottom: 16px;
  }

  .try-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .try-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 600;
    color: #0a1e4d;
    text-decoration: none;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(10, 30, 77, 0.06);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }

  .try-link:hover {
    border-color: #d1d5db;
    box-shadow: 0 6px 16px rgba(10, 30, 77, 0.12);
    transform: translateY(-2px);
  }

  .try-icon {
    width: 20px;
    height: 20px;
    display: block;
  }

  .step {
    margin-bottom: 80px;
  }

  .step-text {
    font-size: 18px;
    color: #6b7280;
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  .slider-row {
    position: relative;
    padding: 0 52px;
  }

  .slider {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(10, 30, 77, 0.18), 0 4px 12px rgba(10, 30, 77, 0.10);
  }

  .slider-track {
    display: flex;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .slide {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    color: #9ca3af;
    font-size: 14px;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .slider-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 50%;
    color: #0a1e4d;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(10, 30, 77, 0.10);
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .slider-arrow--prev {
    left: 0;
  }

  .slider-arrow--next {
    right: 0;
  }

  .slider-arrow:hover {
    background: #f3f4f6;
    border-color: #d1d5db;
  }

  .slider-arrow:active {
    transform: translateY(-50%) scale(0.92);
  }

  .slider-arrow svg {
    width: 16px;
    height: 16px;
  }

  @media (max-width: 640px) {
    .header {
      padding: 20px 24px;
      gap: 24px;
    }
    .nav {
      gap: 20px;
    }
    .main {
      padding: 48px 16px 80px;
    }
    h1 {
      margin-bottom: 48px;
    }
    .try {
      margin-bottom: 56px;
    }
    .step {
      margin-bottom: 56px;
    }
    .step-text {
      font-size: 16px;
      margin-bottom: 24px;
    }
    .slider-row {
      padding: 0 42px;
    }
    .slider-arrow {
      width: 32px;
      height: 32px;
    }
  }
</style>
</head>
<body>

  <main class="main">

    <div class="title">
      <h1>
        <img class="title-icon" src="icon64.svg" alt=""/>
        <span class="title-text" data-i18n="h1">Welcome to AI Email Assistant!</span>
      </h1>
    </div>

    <div class="try">
      <span class="try-label" data-i18n="tryIn">Try it in</span>
      <div class="try-links">
        <a class="try-link" href="https://mail.google.com/mail/u/0/#inbox?compose=new" target="_blank" rel="noopener noreferrer">
          <img class="try-icon" src="gmail.png" alt="Gmail" />
          Gmail
        </a>
        <a class="try-link" href="https://outlook.live.com/mail/0/" target="_blank" rel="noopener noreferrer">
          <img class="try-icon" src="outlook.png" alt="Outlook" />
          Outlook
        </a>
      </div>
    </div>

    <div class="step">
      <p class="step-text" data-i18n="step2">
        Just describe your email and press Enter!
      </p>
      <div class="slider-row">
        <button class="slider-arrow slider-arrow--prev" aria-label="Previous image" data-i18n-aria="prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="slider">
          <div class="slider-track">
            <div class="slide">
              <img src="gmail2.png" srcset="gmail2.png 1x, gmail2-2.png 2x" />
            </div>
            <div class="slide">
              <img src="outlook2.png" srcset="outlook2.png 1x, outlook2-2.png 2x" />
            </div>
          </div>
        </div>
        <button class="slider-arrow slider-arrow--next" aria-label="Next image" data-i18n-aria="next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>

    <div class="step">
      <p class="step-text" data-i18n="step3">
        3. Already have a draft? Just leave your text and tell the AI what to fix.
      </p>
      <div class="slider-row">
        <div class="slider">
          <div class="slide">
            <img src="gmail3.png" srcset="gmail3.png 1x, gmail3-2.png 2x"/>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // ===== i18n =====
    var I18N = {
      en: { title: "Welcome — AI Email Assistant", h1: "Welcome to AI Email Assistant!", tryIn: "Try it in", step1: "1. Open your email composer in Gmail or Outlook and click the magic wand icon.", step2: "2. Describe your email in a few words and press Enter.", step3: "3. Already have a draft? Just leave your text and tell the AI what to fix.", prev: "Previous image", next: "Next image" },
      de: { title: "Willkommen — AI Email Assistant", h1: "Willkommen bei AI Email Assistant!", tryIn: "Ausprobieren in", step1: "1. Öffne den E-Mail-Editor in Gmail oder Outlook und klicke auf das Zauberstab-Symbol.", step2: "2. Beschreibe deine E-Mail in wenigen Worten und drücke Enter.", step3: "3. Hast du schon einen Entwurf? Lass deinen Text einfach stehen und sag der KI, was zu verbessern ist.", prev: "Vorheriges Bild", next: "Nächstes Bild" },
      fr: { title: "Bienvenue — AI Email Assistant", h1: "Bienvenue sur AI Email Assistant !", tryIn: "Essayer sur", step1: "1. Ouvrez votre éditeur d'e-mail dans Gmail ou Outlook et cliquez sur l'icône de baguette magique.", step2: "2. Décrivez votre e-mail en quelques mots et appuyez sur Entrée.", step3: "3. Vous avez déjà un brouillon ? Laissez votre texte et dites à l'IA ce qu'il faut corriger.", prev: "Image précédente", next: "Image suivante" },
      es: { title: "Bienvenido — AI Email Assistant", h1: "¡Bienvenido a AI Email Assistant!", tryIn: "Pruébalo en", step1: "1. Abre el editor de correo en Gmail u Outlook y haz clic en el ícono de la varita mágica.", step2: "2. Describe tu correo en pocas palabras y pulsa Enter.", step3: "3. ¿Ya tienes un borrador? Deja tu texto y dile a la IA qué corregir.", prev: "Imagen anterior", next: "Imagen siguiente" },
      nl: { title: "Welkom — AI Email Assistant", h1: "Welkom bij AI Email Assistant!", tryIn: "Probeer in", step1: "1. Open de e-mail-editor in Gmail of Outlook en klik op het toverstaf-icoon.", step2: "2. Beschrijf je e-mail in een paar woorden en druk op Enter.", step3: "3. Heb je al een concept? Laat je tekst staan en vertel de AI wat er moet worden aangepast.", prev: "Vorige afbeelding", next: "Volgende afbeelding" },
      id: { title: "Selamat datang — AI Email Assistant", h1: "Selamat datang di AI Email Assistant!", tryIn: "Coba di", step1: "1. Buka editor email di Gmail atau Outlook dan klik ikon tongkat ajaib.", step2: "2. Jelaskan email Anda dalam beberapa kata dan tekan Enter.", step3: "3. Sudah punya draf? Biarkan teks Anda dan beri tahu AI apa yang perlu diperbaiki.", prev: "Gambar sebelumnya", next: "Gambar berikutnya" },
      ru: { title: "Добро пожаловать — AI Email Assistant", h1: "Добро пожаловать в AI Email Assistant!", tryIn: "Попробовать в", step1: "1. Откройте редактор письма в Gmail или Outlook и нажмите на иконку волшебной палочки.", step2: "2. Опишите письмо в нескольких словах и нажмите Enter.", step3: "3. Уже есть черновик? Просто оставьте текст и скажите ИИ, что исправить.", prev: "Предыдущее изображение", next: "Следующее изображение" },
      pt: { title: "Bem-vindo — AI Email Assistant", h1: "Bem-vindo ao AI Email Assistant!", tryIn: "Experimente no", step1: "1. Abra o editor de e-mail no Gmail ou Outlook e clique no ícone da varinha mágica.", step2: "2. Descreva seu e-mail em poucas palavras e pressione Enter.", step3: "3. Já tem um rascunho? Deixe seu texto e diga à IA o que corrigir.", prev: "Imagem anterior", next: "Próxima imagem" },
      ja: { title: "ようこそ — AI Email Assistant", h1: "AI Email Assistantへようこそ！", tryIn: "試してみる", step1: "1. GmailまたはOutlookでメール作成画面を開き、魔法の杖アイコンをクリック。", step2: "2. メールの内容を一言で説明し、Enterキーを押します。", step3: "3. すでに下書きがある？テキストはそのままに、AIに修正してほしい点を伝えるだけ。", prev: "前の画像", next: "次の画像" },
      ko: { title: "환영합니다 — AI Email Assistant", h1: "AI Email Assistant에 오신 것을 환영합니다!", tryIn: "사용해 보기", step1: "1. Gmail이나 Outlook에서 이메일 작성 창을 열고 마법봉 아이콘을 클릭하세요.", step2: "2. 이메일 내용을 몇 단어로 설명하고 Enter 키를 누르세요.", step3: "3. 이미 초안이 있나요? 텍스트를 그대로 두고 AI에게 수정할 부분을 알려주세요.", prev: "이전 이미지", next: "다음 이미지" }
    };

    function pickLang() {
      var supported = Object.keys(I18N);
      // ?lang=xx override (for testing / direct links)
      var urlLang = new URLSearchParams(window.location.search).get('lang');
      if (urlLang && supported.indexOf(urlLang.toLowerCase()) !== -1) return urlLang.toLowerCase();
      // browser language(s)
      var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      for (var i = 0; i < list.length; i++) {
        var l = (list[i] || '').toLowerCase().split('-')[0];
        if (supported.indexOf(l) !== -1) return l;
      }
      return 'en';
    }

    (function applyI18n() {
      var lang = pickLang();
      var t = I18N[lang];
      if (!t) return;
      document.documentElement.lang = lang;
      if (t.title) document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-aria');
        if (t[key] !== undefined) el.setAttribute('aria-label', t[key]);
      });
    })();

    // ===== slider =====
    document.querySelectorAll('.slider-row').forEach(function (row, rowIdx) {
      var step = rowIdx + 1;

      // Клик по самой картинке слайда — хотим понять, тыкают ли в неё как в интерфейс
      row.querySelectorAll('.slide').forEach(function (slide, slideIdx) {
        slide.addEventListener('click', function () {
          var img = slide.querySelector('img');
          var src = img ? (img.getAttribute('src') || '') : '';
          if (typeof gtag === 'function') {
            gtag('event', 'slider_image_click', {
              step: step,
              slide_index: slideIdx,
              image: src
            });
          }
        });
      });

      // Навигация слайдера (только в блоках со стрелками)
      var track = row.querySelector('.slider-track');
      if (!track) return;

      var count = row.querySelectorAll('.slide').length;
      var index = 0;

      function go(s) {
        index = (index + s + count) % count;
        track.style.transform = 'translateX(-' + index * 100 + '%)';
      }

      row.querySelector('.slider-arrow--prev').addEventListener('click', function () {
        go(-1);
        if (typeof gtag === 'function') {
          gtag('event', 'slider_navigate', { direction: 'prev', step: step });
        }
      });
      row.querySelector('.slider-arrow--next').addEventListener('click', function () {
        go(1);
        if (typeof gtag === 'function') {
          gtag('event', 'slider_navigate', { direction: 'next', step: step });
        }
      });
    });
  </script>

</body>
</html>
