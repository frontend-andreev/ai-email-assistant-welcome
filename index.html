<title>Welcome — AI Email Assistant</title>
<link rel="icon" type="image/svg+xml" href="images/icon64.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    color: #0a1e4d;
    -webkit-font-smoothing: antialiased;
  }

  .main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 25px 24px 120px;
    text-align: center;
  }

  .title {
    margin-bottom: 24px;
  }

  .title-icon {
    display: inline-block;
    width: 48px;
    height: 48px;
    vertical-align: middle;
    margin-right: 12px;
  }

  .title-text {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    text-wrap: balance;
    max-width: calc(100% - 60px);
  }

  h1 {
    font-size: clamp(36px, 5vw, 52px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .try {
    margin-bottom: 40px;
  }

  .try-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9ca3af;
    margin-bottom: 16px;
  }

  .try-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .try-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 600;
    color: #0a1e4d;
    text-decoration: none;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(10, 30, 77, 0.06);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }

  .try-link:hover {
    border-color: #d1d5db;
    box-shadow: 0 6px 16px rgba(10, 30, 77, 0.12);
    transform: translateY(-2px);
  }

  .try-icon {
    width: 20px;
    height: 20px;
    display: block;
  }

  .step {
    margin-bottom: 80px;
  }

  .step-text {
    font-size: 30px;
    color: #000;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 32px;
    margin-left: auto;
    margin-right: auto;
  }

  .instruction-image {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(10, 30, 77, 0.18), 0 4px 12px rgba(10, 30, 77, 0.10);
  }

  .instruction-image img {
    width: 100%;
    display: block;
  }

  .step:last-child {
    margin-bottom: 0;
  }

  @media (max-width: 640px) {
    .header {
      padding: 20px 24px;
      gap: 24px;
    }
    .nav {
      gap: 20px;
    }
    .main {
      padding: 48px 16px 80px;
    }
    h1 {
      margin-bottom: 48px;
    }
    .try {
      margin-bottom: 56px;
    }
    .step {
      margin-bottom: 56px;
    }
    .step-text {
      font-size: 16px;
      margin-bottom: 24px;
    }
  }
</style>
</head>
<body>

  <main class="main">

    <div class="title">
      <h1>
        <img class="title-icon" src="images/icon64.svg" alt=""/>
        <span class="title-text" data-i18n="h1">Welcome to AI Email Assistant!</span>
      </h1>
    </div>

    <div class="try">
      <span class="try-label" data-i18n="tryIn">Try it in</span>
      <div class="try-links">
        <a class="try-link" href="https://mail.google.com/mail/u/0/#inbox?compose=new" target="_blank" rel="noopener noreferrer">
          <img class="try-icon" src="images/gmail.png" alt="Gmail" />
          Gmail
        </a>
        <a class="try-link" href="https://outlook.live.com/mail/0/" target="_blank" rel="noopener noreferrer">
          <img class="try-icon" src="images/outlook.png" alt="Outlook" />
          Outlook
        </a>
      </div>
    </div>

    <div class="step">
      <p class="step-text" data-i18n="step1">
        Gmail instructions
      </p>
      <div class="instruction-image">
        <img src="images/gmail2.png" srcset="images/gmail2.png 1x, images/gmail2-2.png 2x" alt="Gmail instructions" />
      </div>
    </div>

    <div class="step">
      <p class="step-text" data-i18n="step2">
        Outlook instructions
      </p>
      <div class="instruction-image">
        <img src="images/outlook2.png" srcset="images/outlook2.png 1x, images/outlook2-2.png 2x" alt="Outlook instructions" />
      </div>
    </div>
  </main>

  <script>
    // ===== i18n =====
    var I18N = {
      en: { title: "Welcome — AI Email Assistant", h1: "Welcome to AI Email Assistant!", tryIn: "Try it in", step1: "Gmail instructions", step2: "Outlook instructions" },
      de: { title: "Willkommen — AI Email Assistant", h1: "Willkommen bei AI Email Assistant!", tryIn: "Ausprobieren in", step1: "Anleitung für Gmail", step2: "Anleitung für Outlook" },
      fr: { title: "Bienvenue — AI Email Assistant", h1: "Bienvenue sur AI Email Assistant !", tryIn: "Essayer sur", step1: "Instructions pour Gmail", step2: "Instructions pour Outlook" },
      es: { title: "Bienvenido — AI Email Assistant", h1: "¡Bienvenido a AI Email Assistant!", tryIn: "Pruébalo en", step1: "Instrucciones para Gmail", step2: "Instrucciones para Outlook" },
      nl: { title: "Welkom — AI Email Assistant", h1: "Welkom bij AI Email Assistant!", tryIn: "Probeer in", step1: "Instructies voor Gmail", step2: "Instructies voor Outlook" },
      id: { title: "Selamat datang — AI Email Assistant", h1: "Selamat datang di AI Email Assistant!", tryIn: "Coba di", step1: "Panduan untuk Gmail", step2: "Panduan untuk Outlook" },
      ru: { title: "Добро пожаловать — AI Email Assistant", h1: "Добро пожаловать в AI Email Assistant!", tryIn: "Попробовать в", step1: "Инструкция для Gmail", step2: "Инструкция для Outlook" },
      pt: { title: "Bem-vindo — AI Email Assistant", h1: "Bem-vindo ao AI Email Assistant!", tryIn: "Experimente no", step1: "Instruções para o Gmail", step2: "Instruções para o Outlook" },
      ja: { title: "ようこそ — AI Email Assistant", h1: "AI Email Assistantへようこそ！", tryIn: "試してみる", step1: "Gmailの使い方", step2: "Outlookの使い方" },
      ko: { title: "환영합니다 — AI Email Assistant", h1: "AI Email Assistant에 오신 것을 환영합니다!", tryIn: "사용해 보기", step1: "Gmail 사용 안내", step2: "Outlook 사용 안내" }
    };

    function pickLang() {
      var supported = Object.keys(I18N);
      // ?lang=xx override (for testing / direct links)
      var urlLang = new URLSearchParams(window.location.search).get('lang');
      if (urlLang && supported.indexOf(urlLang.toLowerCase()) !== -1) return urlLang.toLowerCase();
      // browser language(s)
      var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      for (var i = 0; i < list.length; i++) {
        var l = (list[i] || '').toLowerCase().split('-')[0];
        if (supported.indexOf(l) !== -1) return l;
      }
      return 'en';
    }

    (function applyI18n() {
      var lang = pickLang();
      var t = I18N[lang];
      if (!t) return;
      document.documentElement.lang = lang;
      if (t.title) document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });
    })();
  </script>

</body>
</html>
